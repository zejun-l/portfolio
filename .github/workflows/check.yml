name: Check portfolio
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-data.mjs --check
      - run: node scripts/check-links.mjs
      - run: node --check js/app.js && node --check js/case-study.js && node --check js/shared.js && node --check js/data.js
